name: Camsil
options:
  bundleIdPrefix: com.ahmetkorkmaz
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  CamsilCore:
    type: framework
    platform: macOS
    sources:
      - path: CamsilCore
        excludes: ["Shaders/*.h"]
      - path: CamsilCore/Shaders/ShaderCommon.h
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmetkorkmaz.CamsilCore
        GENERATE_INFOPLIST_FILE: YES
  Camsil:
    type: application
    platform: macOS
    sources: [Camsil]
    dependencies:
      - target: CamsilCore
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: Camsil/App/Info.plist
      properties:
        CFBundleDisplayName: Camsil
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmetkorkmaz.Camsil
        ENABLE_HARDENED_RUNTIME: YES
  CamsilCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [CamsilCoreTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CamsilCore
schemes:
  Camsil:
    build:
      targets:
        Camsil: all
        CamsilCoreTests: [test]
    test:
      targets: [CamsilCoreTests]
