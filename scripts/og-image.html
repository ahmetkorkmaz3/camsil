<!doctype html>
<!-- Source of site/og-image.png. Render it with scripts/make-og-image.sh. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #f6f9fb;
    --text: #10161c;
    --muted: #56636f;
    --border: #d9e3ea;
    --accent: #1a6fc4;
    --accent-2: #45a7e8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(circle at 85% 20%, rgba(69, 167, 232, .2), transparent 45%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    padding: 0 80px;
    gap: 56px;
  }
  .text { flex: 1; }
  .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 36px; }
  .brand img { width: 72px; height: 72px; }
  .brand span { font-size: 34px; font-weight: 700; letter-spacing: -.5px; }
  h1 { font-size: 62px; line-height: 1.08; letter-spacing: -1.5px; margin: 0 0 24px; font-weight: 800; }
  h1 .grad { background: linear-gradient(90deg, var(--accent-2), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { font-size: 24px; color: var(--muted); margin: 0; }
  .glass {
    width: 400px; height: 300px; flex: none;
    border-radius: 18px; overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 30px 60px -25px rgba(16, 40, 64, .4);
  }
  .glass svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
  <div class="text">
    <div class="brand"><img src="../site/icon.png" alt=""><span>Camsil</span></div>
    <h1>Your screen is a dirty window.<br><span class="grad">Clean it.</span></h1>
    <p>Spray it and wipe it until it shines. A small toy for the Mac.</p>
  </div>
  <div class="glass">
    <svg viewBox="0 0 400 300" aria-hidden="true">
      <defs>
        <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#5fb8f0"/>
          <stop offset=".55" stop-color="#2b78c9"/>
          <stop offset="1" stop-color="#173f7a"/>
        </linearGradient>
        <filter id="dust" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="n"/>
          <feColorMatrix in="n" type="matrix" values="0 0 0 0 .78  0 0 0 0 .74  0 0 0 0 .66  0 0 0 -1.6 1.25"/>
          <feComposite in2="SourceGraphic" operator="in"/>
        </filter>
        <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
        <mask id="wipe" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="300">
          <rect width="400" height="300" fill="#fff"/>
          <path d="M40 90 C 120 50, 200 130, 280 80 S 360 90, 360 110 M 350 170 C 270 220, 190 150, 110 200 S 50 220, 40 230"
                fill="none" stroke="#000" stroke-width="56" stroke-linecap="round" filter="url(#soft)"/>
        </mask>
      </defs>
      <rect width="400" height="300" fill="url(#wall)"/>
      <rect width="400" height="16" fill="#fff" opacity=".22"/>
      <rect x="30" y="44" width="190" height="140" rx="8" fill="#fff" opacity=".92"/>
      <rect x="200" y="110" width="170" height="160" rx="8" fill="#fff" opacity=".85"/>
      <rect x="30" y="44" width="190" height="20" rx="8" fill="#d7e3ee"/>
      <rect x="200" y="110" width="170" height="20" rx="8" fill="#d7e3ee"/>
      <g fill="#b9c8d6">
        <rect x="46" y="80" width="130" height="8" rx="4"/>
        <rect x="46" y="98" width="150" height="8" rx="4"/>
        <rect x="46" y="128" width="80" height="40" rx="6" fill="#9fc7ec"/>
        <rect x="216" y="146" width="130" height="8" rx="4"/>
        <rect x="216" y="190" width="140" height="64" rx="6" fill="#a7d3c2"/>
      </g>
      <g mask="url(#wipe)">
        <rect width="400" height="300" fill="#b8ad98" opacity=".5"/>
        <rect width="400" height="300" fill="#fff" filter="url(#dust)" opacity=".55"/>
        <g fill="none" stroke="#efe8da" stroke-opacity=".6" stroke-width="2.5">
          <circle cx="80" cy="250" r="13"/><circle cx="104" cy="270" r="7"/><circle cx="330" cy="40" r="11"/>
        </g>
        <g fill="none" stroke="#5b4f40" stroke-opacity=".3" stroke-width="2" transform="translate(320 240) rotate(-25)">
          <ellipse rx="8" ry="12"/><ellipse rx="13" ry="18"/><ellipse rx="18" ry="24"/><ellipse rx="23" ry="30"/>
        </g>
      </g>
      <g fill="#e9f6ff" fill-opacity=".8" stroke="#fff" stroke-width="1">
        <circle cx="150" cy="120" r="5"/><path d="M150 100 v14" stroke-opacity=".5"/>
        <circle cx="300" cy="150" r="4"/>
      </g>
      <path d="M280 80 l5 -17 l5 17 l17 5 l-17 5 l-5 17 l-5 -17 l-17 -5 z" fill="#fff"/>
      <g transform="translate(360 112)">
        <rect x="-26" y="-20" width="52" height="40" rx="9" fill="#f2c94c" stroke="#c99a1a" stroke-width="2"/>
        <path d="M-18 -8 h36 M-18 2 h36 M-18 12 h36" stroke="#d9a92a" stroke-width="2"/>
      </g>
    </svg>
  </div>
</body>
</html>
